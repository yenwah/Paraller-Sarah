<script id="data" type="application/json">[{"id": "DeWV5EXkYm_", "pf": "IG", "shares": 0, "tracker": "Instagram 竞对", "competitor": "bskin_asia", "caption": "Okay, real talk: what even are hormones? 🤔\n\nWe blame them for everything: the breakout before your period, the 3pm crash, crying at a dog food ad. But most of us have never actually asked what they are, or why they get such a bad rep.\n\nSo we're starting a new series: Embarrassing Questions About Hormones You Don't Know Who to Ask, to help you understand what's really going on in your body (and your skin).\n\nLucky for us, our founder Su-Mae has a hormone expert in the family: her sister, Dr. Chia Su-Ynn, an endocrinologist (aka a doctor who specialises in hormones).\n\nIn this very first episode, we're exploring what hormones actually are, and whether they really deserve the blame 👀\n\nGot a question you've always wondered about? Drop it in the comments (anonymous DMs welcome too) and it might make the next episode. Follow along so you don't miss it 🧡", "transcript": "Hello and welcome to our new series, embarrassing questions about hormones, which you don't know who to ask. I'm Sume, founder of Beeskin, and today I have with me my sister. Please don't ask who's older, who happens to be an endocrinologist, a doctor that deals with hormones. So Dr. Chia, can I ask you, what are hormones? I think a lot of people put the label hormones onto this big bag of things they really don't understand. But hormones are actually a really important messenger in our body, and they're like more than 50. Oh wow, so my understanding is that hormones are almost like the enemy, because they cause so many problems for women especially. Mmm, and that's absolutely a misconception. In fact, hormones are messengers that connect all the different systems in our body so that everything is moving according to plan. So without hormones, you would die. Ah, so even though we hear terms like hormonal imbalance, perimenopause, menopause, we kind of have to live with those things because the alternative is being dead? Yeah, I think so. Okay, I'm not sure how comforting that is, but thank you for that. And if you like what we're sharing, please follow on to see our next series.", "brk": "Hook类型: 痛点直击\n结构: 抛出日常误区 → 专家姐姐科普 → 纠正错误认知\n为什么火: 用幽默对话打破严肃科普，借医生背书建立专业信任\n改编角度: 针对敏感肌屏障受损，可联动皮肤科医生拆解激素与烂脸的真实关系", "my": "肌肤常年敏感泛红干燥发痒，照镜子更是能免则免吗？\n\n你可能试过了一种又一种别人都说能补水的产品，结果肌肤依然干干的，发痒甚至脱屑。\n\n大家总以为是皮肤没有做好保湿，或者以为是用了不对的洁面产品。\n\n其实真正的原因，是被破坏的角质层需要深层的修复，而不是盲目地堆叠各种保湿霜。\n\n护肤，养肤就从小绿瓶起。\n\n每天早晚各滴3到4滴小绿瓶在手掌，再轻抚脸上的每一寸肌肤。\n\n分子小小的小绿瓶，只要数秒，修复精华液很快就被肌肤吸收。\n\n丰富的植物萃取精华，专为敏感肌肤而研发，有效在30分钟内舒缓不适。\n\n它含有抗发炎、抗氧化成分对抗自由基，同时抑制黑色素形成并淡斑。\n\n坚持使用可以保湿，抗皱，缓慢肌肤老化，让敏感泛红和干燥肌肤立即得到从所未有所舒缓。\n\n以前每天照镜子都觉得心烦，看着泛红发痒的脸，换了无数种产品都没用。\n\n现在肌肤状况越来越稳定和亮丽，摸起来滑滑的，找回了健康好状态。\n\n如果你也想解决肌肤问题，现在就私信我，领取一对一精简护肤指导。", "tags": "", "bait": false, "type": "Video", "likes": 283, "comments": 8, "er": 4.71, "followers": 6177, "date": "2026-10-11", "url": "https://www.instagram.com/p/DeWV5EXkYm_/", "video": true, "ratio": 0, "score": 4.97, "status": "已处理", "x": 3.8}, {"id": "De3p6xnjzam", "pf": "IG", "shares": 0, "tracker": "Instagram 竞对", "competitor": "bskin_asia", "caption": "We've kept you waiting for 11 years.\n\nAnd we think it's finally time.\n\nFor the very first time, B/SKIN is stepping beyond the screen and into our own physical pop-up at Boutiques Singapore! ❤️\n\nAnd we couldn't just turn up with our usual favourites! Come experience our hormone-safe skincare in person and discover a few exciting surprises we've been working on just for this special occasion.\n\nBoutiques Singapore: The Gifting Edition 2026\nF1 Pit Building | Room 3B, Space 30\n20–22 November 2026\n🎟️ Tickets on sale now at boutiquefairs.com.sg", "transcript": "For 11 years, every time you asked me this, I said, Not yet. This November, B Skin is finally doing a pop-up in Singapore. B Skin started with my own battle with bad skin. I spent years chasing trends and buying more products than I needed. I always thought it was my skin that was the problem. Turns out it was my hormones. Now, I'm a mum of three running a business, so everything I put on my skin has to be hormone-safe, multitasking and effective. That's what B Skin is about. Skincare that's safe for your hormones, whether that's breakouts before your period, pregnancy, perimenopause or menopause, in textures light enough for Singapore humidity. This November, B Skin is popping up at boutiques for the first time ever. And we didn't want to turn up with just the usual, so we made a few things you'll only find at boutiques. Some of them perfect for the gifting season. So come say hi, try everything you've been curious about and finally meet us. We'll be at Stage 30 in Room 3B and I can't wait to see you there.", "brk": "Hook类型: 身份共鸣\n结构: 品牌11年首次线下快闪 → 创始人真实烂脸与激素护肤心路 → 适合新加坡湿热气候的新品邀约\n为什么火: 创始人真诚分享自身激素护肤痛点，建立深度信任并结合稀缺性线下活动\n改编角度: 聚焦Real Skin Journey，讲述自己从激素失衡到重建屏障的真实抗敏故事", "my": "肌肤常年敏感，泛红，干燥，发痒，毛孔更粗大，照镜子更是能免则免。\n\n你以为是自己年纪大了，或者买的护肤品还不够贵，所以才一直没有效果。\n\n其实不是你的问题，是因为你一直没有用对真正专为敏感肌研发的修复产品。\n\n第一步，先用清水做好温和洁面。洗完脸后千万不要用力擦干，而是用干净的毛巾轻轻按压掉多余的水分。\n\n第二步，每天早晚各滴3-4滴小绿瓶在手掌，再轻抚脸上的每一寸肌肤。\n\n分子小小的小绿瓶，水状质地，只要数秒，修复精华液很快就被肌肤吸收，敏感，泛红和干燥肌肤立即得到从所未有过的舒缓感。\n\n第三步，给肌肤做好日常的锁水保湿。丰富植物萃取精华的小绿瓶，可以修复被破坏的角质层，达到保湿和激活肌肤自我更新功能。\n\n以前的我，寻寻觅觅，试过了一种又一种别人都说能补水的产品，肌肤依然干干的，发痒甚至脱屑。\n\n现在开始每天坚持用小绿瓶，肌肤状况变得越来越稳定和亮丽，不再动不动就泛红发痒。\n\n如果你也想让敏感肌得到真正的舒缓，现在就私信我，让我们一对一帮你进行精简护肤指导。\n\n护肤，养肤就从小绿瓶起。", "tags": "", "bait": false, "type": "Video", "likes": 175, "comments": 6, "er": 2.93, "followers": 6177, "date": "2026-10-24", "url": "https://www.instagram.com/p/De3p6xnjzam/", "video": true, "ratio": 0, "score": 3.12, "status": "未处理", "x": 2.4}, {"id": "DdS6VbwDO2c", "pf": "IG", "shares": 0, "tracker": "Instagram 竞对", "competitor": "bskin_asia", "caption": "Introducing the NEW B/SKIN Fresh Start Oil Control Serum, a lightweight daily serum that controls excess shine without leaving skin feeling dry, tight or irritated.\n\nFormulated for hot and humid climates, regulates excess oil while ensure your skin maintains the hydration it needs to feel comfortable and fresh. \n\nFast-absorbing and lightweight, it fits seamlessly into your daily routine — doubling as a pre-makeup essential so your base still looks flawless at 9pm, not just when you put it on.\n\nOil regulation, not oil removal.\n\nNow available. Discover it via the link in bio.", "transcript": "Hi, I'm really excited today to share with you our new launch, which is our oil control serum. So it's something that has been in the works for about two years now. I'm so excited that we're finally launching it this weekend in Singapore. So what I really love about this product is that unlike other oil control products, this one doesn't dry out your skin. Instead, what it does is it helps to balance oil production. So in the long run, after a couple of weeks of use, you will notice that your skin tends to be less oily. And on a daily basis, let's say you use it in the morning. If you use it on your full face or just say on your T-zone, in the evening, you'll notice that in the areas that you're usually really shiny and oily, you're actually not so oily. It also goes on really nicely as a makeup base. So it makes your skin a little smoother and helps make up for nicer as well.", "brk": "Hook类型: 痛点直击\n结构: 研发背景 → 核心功效 → 实际效果\n为什么火: 创始人出镜背书加真实场景对比，直击控油反干的痛点\n改编角度: 结合敏感肌与皮肤屏障，强调控油同时修护不刺激，展示真实好皮之旅", "my": "肌肤常年敏感，泛红，干燥，发痒，毛孔粗大，照镜子更是能免则免。\n\n寻寻觅觅，试过了一种又一种别人都说能补水产品，肌肤依然干干的，发痒甚至脱屑。\n\n你以为是自己涂的护肤品不够多，或者买的牌子还不够贵。\n\n其实不是，是因为你破坏的角质层根本没有得到真正的修复。\n\n护肤，养肤就从小绿瓶起，每天早晚各滴3-4滴小绿瓶在手掌，再轻抚脸上的每一寸肌肤。\n\n分子小小的小绿瓶，只要数秒，修复精华液很快就被肌肤吸收。\n\n敏感，泛红和干燥肌肤立即得到从所未有过的舒缓感，肌肤状况更是越来越稳定和亮丽。\n\n小绿瓶是修复精华液，水状质地，满满的抗氧化成份，每一滴都是满满的植物萃取精华，专为敏感肌肤而研发。\n\n它可修复被破坏的角质层，达到保湿和激活肌肤自我更新功能。\n\n有效的在30分钟内舒缓，渗透进入皮肤，进行修复，给予抗氧化，达到肌肤抗老化，淡斑，提亮肤色的效果。\n\n以前你花了很多冤枉钱去买各种普通的保湿水，结果脸上还是动不动就泛红脱屑。\n\n现在你只要用小绿瓶修复精华液，每天早晚花几秒钟时间，就能让干燥的皮肤得到满满的植物萃取精华。\n\n如果你想了解适合自己的一对一精简护肤指导，现在就私讯我，让我看看你的皮肤状况。", "tags": "", "bait": false, "type": "Video", "likes": 126, "comme  "Instagram 竞对", "competitor": "bskin_asia", "caption": "Who knew designing a 4×3 metre space could be THIS complicated 🥹\n\nIt's our first time planning a physical pop-up, and let's just say we didn't realise how MANY things we'd have to consider. From squeezing all our ideas into a 4×3 metre space to going through 60+ design revisions, it's been quite the journey. 😂\n\nSo, what did our final design end up looking like? And what have we got planned for our space? 👀\n\nCome find out for yourself at:\n📍 Boutiques Singapore: The Gifting Edition 2026\nF1 Pit Building | Room 3B, Space 30\n📅 20–22 November 2026\n\nSee you there! 🧡\n\n#BSKIN #BoutiquesSingapore #RoadToBoutiques", "transcript": "Do you want to guess how many booth designs we've gone through for our very first pop-up? I'm Sumei, founder of Bee Skin, and we make skin care for what your skin actually needs without throwing your hormones off balance. I thought designing a small space would be pretty straightforward. I mean, it's not like we're designing an entire store, right? Oh my gosh, I couldn't have been more wrong. We've actually gone through more than 60 rounds of design revisions, and hot tip, not everything that's in your head can fit into a 4x3 metre booth. Honestly, I'm not really sure if we'll be able to pull it off, but you should come by our booth and see which designs made the final cut. See you there.", "brk": "Hook类型: 悬念+真实幕后\n结构: 创始人自曝筹备难题 → 经历60稿修改的崩溃 → 引导用户线下见证成果\n为什么火: 创始人真诚出镜展现创业幕后，用“60次修改”的数字反差制造悬念\n改编角度: 记录敏感肌修护产品研发的真实幕后，展示历经多次配方调整的Real Skin Journey", "my": "肌肤常年敏感，泛红，干燥，发痒，毛孔粗大，照镜子更是能免则免。\n\n你是不是也这样，寻寻觅觅，试过了一种又一种别人都说能补水的产品，结果肌肤依然干干的，发痒甚至脱屑？\n\n很多人以为，敏感肌想要变好，就要去买各种昂贵的面霜，或者把家里的护肤品全部换掉。\n\n其实不是的，真正的原因是你的角质层被破坏了，皮肤屏障出了问题，用再多普通的补水产品也吸收不进去。\n\n想要养好敏感肌，其实只需要做好这三步。\n\n第一步，精简你的护肤步骤。每天早晚清洁后，不要拍太多乱七八糟的爽肤水，减轻皮肤的负担。\n\n第二步，选择对的产品。每天早晚各滴3到4滴小绿瓶在手掌，再轻抚脸上的每一寸肌肤。\n\n分子小小的小绿瓶，是专为敏感肌而研发的水状质地，修复精华液只要数秒很快就被肌肤吸收。\n\n每一滴都是满满的植物萃取精华，带有满满的抗氧化成分，可以修复被破坏的角质层，达到保湿和激活肌肤自我更新功能。\n\n第三步，坚持日常的温和养护。它能对抗自由基，抑制黑色素形成，淡斑提亮 const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const byRec = {}; DATA.forEach(d => byRec[d.id] = d);
const TRENDS = [];
DATA.forEach(d => {
  d.days = d.date ? Math.max(0, Math.floor((Date.now() - new Date(d.date + 'T00:00:00')) / 864e5)) : null;
  d.horse = d.followers > 0 && d.followers < 50000 && ((d.x || 0) >= 2 || d.score >= 10);
});
const PRESETS = [
  { k: 'px', icon: 'trend', label: '真爆款 ×2+', f: d => (d.x || 0) >= 2 },
  { k: 'pn', icon: 'star', label: '近7天', f: d => d.days !== null && d.days <= 7 },
  { k: 'ph', icon: 'zap', label: '黑马', f: d => d.horse },
  { k: 'pb', icon: 'magnet', label: '引流帖', f: d => d.bait },
];
const presetOn = {};

function toast(msg, ok) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  t.style.borderColor = ok ? 'var(--green)' : 'var(--red)';
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

// filters
const comps = [...new Set(DATA.map(d => d.competitor))].sort();
comps.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = '@'+c; $('fComp').appendChild(o); });
[...new Set(DATA.map(d => d.tracker))].forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; $('fTracker').appendChild(o); });
if ([...$('fTracker').options].some(o => o.value === DEFAULT_TRACKER)) $('fTracker').value = DEFAULT_TRACKER;

function matchQ(d) {
  const q = ($('fSearch').value || '').trim().toLowerCase();
  return !q || (d.caption + ' ' + (d.tags || '') + ' ' + (d.transcript || '') + ' ' + (d.brk || '') + ' ' + d.competitor).toLowerCase().includes(q);
}

function basePool() {
  const t = $('fTracker').value, c = $('fComp').value;
  return DATA.filter(d => (!t || d.tracker === t) && (!c || d.competitor === c) && (!videoOnly || d.video)
    && matchQ(d) && PRESETS.every(p => !presetOn[p.k] || p.f(d)));
}

function filtered() {
  const s = $('fSort').value;
  let arr = basePool().filter(d => curTab === '全部' || d.status === curTab);
  const key = { score:'score', er:'er', comments:'comments', likes:'likes', shares:'shares', x:'x' }[s];
  if (s === 'date') arr.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  else arr.sort((a,b) => (b[key]||0) - (a[key]||0));
  return arr;
}

let dragRec = null;

function renderTabs() {
  const pool = basePool();
  const counts = { '全部': pool.length };
  STATUSES.forEach(s => counts[s] = pool.filter(d => d.status === s).length);
  $('tabs').innerHTML = '';
  ['全部', ...STATUSES].forEach(name => {
    const el = document.createElement('div');
    el.className = 'tab' + (curTab === name ? ' on' : '') + (name !== '全部' ? ' droppable' : '');
    el.innerHTML = esc(name) + ' <span class="cnt">' + counts[name] + '</span>';
    el.onclick = () => { curTab = name; shown = PAGE; render(); };
    if (name !== '全部') {
      el.ondragover = e => { if (dragRec) { e.preventDefault(); el.classList.add('over'); } };
      el.ondragleave = () => el.classList.remove('over');
      el.ondrop = e => {
        e.preventDefault(); el.classList.remove('over');
        const d = byRec[dragRec]; dragRec = null;
        if (d && d.status !== name) setStatus(d, name);
      };
    }
    $('tabs').appendChild(el);
  });
}

const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const el = e.target, pid = el.dataset.pid;
      if (!el.querySelector('iframe')) {
        const f = document.createElement('iframe');
        f.src = (byRec[pid] || {}).pf === 'FB'
          ? 'https://www.facebook.com/plugins/post.php?show_text=true&width=500&href=' + encodeURIComponent((byRec[pid] || {}).url || '')
          : 'https://www.instagram.com/p/' + pid + '/embed/';
        f.loading = 'lazy'; f.allow = 'autoplay; encrypted-media';
        el.appendChild(f);
      }
      io.unobserve(el);
    }
  });
}, { rootMargin: '400px' });

async function setStatus(d, val) {
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?post_id=eq.' + encodeURIComponent(d.id), {
      method: 'PATCH',
      headers: { 'apikey': ANON, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ status: val })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d.status = val;
    cacheStatus(d.id, val);
    toast('✓ @' + d.competitor + ' 已移到「' + val + '」', true);
  } catch (e) {
    toast('更新失败: ' + e.message + (String(e.message).includes('401') || String(e.message).includes('403') ? ' — 密钥无效?' : ''), false);
  }
  render();
}

function card(d, idx) {
  const el = document.createElement('div');
  el.className = 'card' + ((d.x || 0) >= 2 ? ' outlier' : '');
  el.style.animationDelay = Math.min(idx % PAGE, 14) * 30 + 'ms';
  el.draggable = true;
  el.ondragstart = e => {
    dragRec = d.id;
    e.dataTransfer.effectAllowed = 'move';
    el.classList.add('lifting');
    document.body.classList.add('dragging');
  };
  el.ondragend = () => {
    el.classList.remove('lifting');
    document.body.classList.remove('dragging');
    dragRec = null;
  };
  const typeIcon = d.video ? 'video' : (d.type === 'Carousel' ? 'layers' : 'image');
  const days = d.days, horse = d.horse;
  const ago = days === null ? '' : (days === 0 ? '今天' : days + '天前');
  const lines = (d.caption || '').split('\n').map(l => l.trim()).filter(Boolean);
  const hook = lines[0] || '';
  const tr = (d.transcript && d.transcript !== '(转录失败)' && d.transcript !== '(无口播内容)') ? d.transcript : '';
  el.innerHTML = `
    <div class="embed${d.pf === 'FB' ? ' fb' : ''}" data-pid="${d.id}"><div class="ph"><svg class="ic"><use href="#i-${typeIcon}"/></svg></div></div>
    <div class="meta">
      <div class="row1">
        <span class="handle" title="拖到上方 tab 即可归类">${I('grip')}</span>
        <a class="who" href="${d.pf === 'FB' ? 'https://www.facebook.com/' : 'https://www.instagram.com/'}${d.competitor}/" target="_blank">@${d.competitor}</a>
        <span class="badge">${d.type || '-'}</span>
        ${days !== null && days <= 7 ? '<span class="badge bnew">' + I('star') + '新帖</span>' : ''}
        ${horse ? '<span class="badge bhorse">' + I('zap') + '黑马</span>' : ''}
        ${d.bait ? '<span class="badge bbait" title="「留言XX」引流打法 — 评论被引流放大,漏斗设计值得学">' + I('magnet') + '引流</span>' : ''}
        <span class="date" title="${d.date || ''}">${ago}</span>
      </div>
      <div class="nums">
        <span class="num hot" title="Viral Score">${I('flame')}<b>${d.score}</b></span>
        ${(d.x || 0) >= 2 ? '<span class="num x" title="是自家平均热度的多少倍">' + I('trend') + '<b>×' + d.x + '</b></span>' : ''}
        <span class="num er" title="Engagement Rate">${I('pct')}<b>${d.er}%</b></span>
        <span class="num" title="Likes">${I('heart')}<b>${d.likes > 0 ? fmt(d.likes) : '隐藏'}</b></span>
        <span class="num" title="Comments">${I('msg')}<b>${fmt(d.comments)}</b></span>
        ${d.pf === 'FB' ? '<span class="num" title="Shares">' + I('share') + '<b>' + fmt(d.shares || 0) + '</b></span>' : ''}
        <span class="num" title="Followers">${I('users')}<b>${fmt(d.followers)}</b></span>
      </div>
      <div class="cap" onclick="this.classList.toggle('open')"></div>
      ${d.brk ? '<div class="ai" onclick="this.classList.toggle(&quot;open&quot;)"></div>' : ''}
      ${d.my ? '<div class="mine" onclick="this.classList.toggle(&quot;open&quot;)"></div>' : ''}
      <div class="srow"><label>状态</label><select class="status btn s${d.status}"></select>
        <button class="abtn copy" title="复制完整文案">${I('copy')}文案</button>
        ${tr ? '<button class="abtn mic" title="复制视频口播逐字稿">' + I('mic') + '口播</button>' : ''}
        ${d.my ? '<button class="abtn minec" title="复制我的改写口播稿(可直接拍)">' + I('mic') + '我的稿</button>' : ''}
        <button class="abtn brief" title="复制拍摄 Brief(数据+Hook+AI拆解+我的稿+口播稿+文案)">${I('clip')}Brief</button>
        <a class="abtn" href="${d.url}" target="_blank" title="打开 ${d.pf === 'FB' ? 'Facebook' : 'Instagram'} 原帖">${I('ext')}</a></div>
    </div>`;
  const capEl = el.querySelector('.cap');
  const restTxt = lines.slice(1).join('\n');
  capEl.innerHTML = hook ? '<b>' + esc(hook) + '</b>' + (restTxt ? '<br>' + esc(restTxt).replace(/\n/g, '<br>') : '') : '';
  const aiEl = el.querySelector('.ai');
  if (aiEl) aiEl.innerHTML = '<b>💡 AI 拆解</b><br>' + esc(d.brk).split(String.fromCharCode(10)).join('<br>');
  const myEl = el.querySelector('.mine');
  if (myEl) myEl.innerHTML = '<b>🎬 我的版本(可直接拍)</b><br>' + esc(d.my).split(String.fromCharCode(10)).join('<br>');
  const sel = el.querySelector('.status');
  STATUSES.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
  sel.value = d.status;
  sel.onchange = () => setStatus(d, sel.value);
  el.querySelector('.copy').onclick = () =>
    navigator.clipboard.writeText(d.caption || '').then(() => toast('✓ 文案已复制', true));
  const micBtn = el.querySelector('.mic');
  if (micBtn) micBtn.onclick = () =>
    navigator.clipboard.writeText(tr).then(() => toast('✓ 口播稿已复制', true));
  const mineBtn = el.querySelector('.minec');
  if (mineBtn) mineBtn.onclick = () =>
    navigator.clipboard.writeText(d.my).then(() => toast('✓ 我的改写稿已复制', true));
  el.querySelector('.brief').onclick = () => {
    const NL = String.fromCharCode(10);
    const parts = ['🎬 爆款参考 @' + d.competitor + ((d.x || 0) >= 2 ? '(自家平均 ×' + d.x + ')' : ''),
      '📊 🔥' + d.score + ' | ER ' + d.er + '% | ❤️ ' + (d.likes > 0 ? fmt(d.likes) : '隐藏') +
      ' | 💬 ' + fmt(d.comments) + ' | 👥 ' + fmt(d.followers) + (ago ? ' | ' + ago : ''),
      '🔗 ' + d.url, '✍️ Hook: ' + hook];
    if (d.brk) parts.push('——— AI 拆解 ———', d.brk);
    if (d.my) parts.push('——— 我的版本(可直接拍)———', d.my);
    if (tr) parts.push('——— 竞对原口播稿 ———', tr);
    parts.push('——— 完整文案 ———', d.caption || '');
    navigator.clipboard.writeText(parts.join(NL)).then(() => toast('✓ Brief 已复制,可直接发给拍摄/剪辑', true));
  };
  io.observe(el.querySelector('.embed'));
  return el;
}

function render() {
  renderTabs();
  const arr = filtered();
  const grid = $('grid'); grid.innerHTML = '';
  arr.slice(0, shown).forEach((d, i) => grid.appendChild(card(d, i)));
  $('empty').style.display = arr.length ? 'none' : '';
  $('moreWrap').style.display = arr.length > shown ? '' : 'none';
}


function applyStatusCache() {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    Object.keys(c).forEach(rid => { const d = byRec[rid]; if (d) d.status = c[rid]; });
  } catch (e) {}
}

function cacheStatus(rid, val) {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    c[rid] = val; localStorage.setItem('st_cache', JSON.stringify(c));
  } catch (e) {}
}

// live status refresh (so weekly-baked page shows current statuses)
async function refreshStatuses() {
  applyStatusCache(); render();  // last-known statuses first
  if (Date.now() - (+localStorage.getItem('st_ts') || 0) < 600000) return;  // 10-min throttle
  localStorage.setItem('st_ts', String(Date.now()));
  const fresh = {};
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?select=post_id,status', { headers: { 'apikey': ANON } });
    if (!r.ok) return;
    (await r.json()).forEach(row => {
      const d = byRec[row.post_id];
      if (d) d.status = row.status || '未处理';
      if (row.status && row.status !== '未处理') fresh[row.post_id] = row.status;
    });
    localStorage.setItem('st_cache', JSON.stringify(fresh));
    render();
  } catch (e) {}
}

['fTracker','fComp','fSort'].forEach(id => $(id).onchange = () => { shown = PAGE; render(); });
$('fSearch').oninput = () => { shown = PAGE; render(); };
$('fVideo').onclick = () => { videoOnly = !videoOnly; $('fVideo').classList.toggle('on', videoOnly); shown = PAGE; render(); };
$('moreBtn').onclick = () => { shown += PAGE; render(); };

// preset quick filters
$('presets').innerHTML = '<span class="lbl">快筛</span>';
PRESETS.forEach(p => {
  const c = document.createElement('span'); c.className = 'chip2';
  c.innerHTML = I(p.icon) + esc(p.label);
  c.onclick = () => { presetOn[p.k] = !presetOn[p.k]; c.classList.toggle('on', presetOn[p.k]); shown = PAGE; render(); };
  $('presets').appendChild(c);
});

// trending hashtags among outlier posts
if (TRENDS.length) {
  $('trends').innerHTML = '<span class="lbl">爆款热词</span>';
  TRENDS.forEach(([tag, n]) => {
    const c = document.createElement('span'); c.className = 'chip2';
    c.textContent = '#' + tag + ' ' + n;
    c.onclick = () => { $('fSearch').value = $('fSearch').value === tag ? '' : tag; shown = PAGE; render(); };
    $('trends').appendChild(c);
  });
} else { $('trends').style.display = 'none'; }

render();
refreshStatuses();
</script>
</body>
</html>
